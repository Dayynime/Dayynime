{% extends "base.html" %}
{% block title %}Masuk admin | {{ site.name }}{% endblock %}

{% block content %}
<section class="page-head wrap">
  <h1>Masuk admin</h1>
  <p class="sub">Khusus pemilik katalog.</p>
</section>
<section class="sec wrap">
  <form class="fields adm-narrow" method="post" autocomplete="off">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autofocus>
      {% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
    </div>
    <div><button class="btn solid" type="submit">Masuk</button></div>
  </form>
</section>
{% endblock %}
